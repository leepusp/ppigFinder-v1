[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppigfinder"
version = "2.9.14"
description = "Protein-Protein Interaction Genomic Finder"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Gabriel Umaji Oka" },
    { name = "Camilla Adan" },
    { name = "Celso Vítor Alves Queiroz Calomeno", email = "celsovitor.cvc@gmail.com" },
    { name = "Chuck Shaker Farah" },
    { name = "Robson Francisco de Souza", email = "rfsouza@usp.br" },
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
interactive = ["ipython>=8"]
gui = [
    "PyQt6>=6.4",
]
recommended = [
    "pyrodigal>=2.0",
    "paramiko>=2.9",
    "scipy>=1.7",
]
dev = [
    "pytest>=7",
]

[project.scripts]
ppigfinder = "ppigfinder.cli:main"
ppigfinder-af3 = "ppigfinder.integrations.af3.cli:main"
ppigfinder-remote = "ppigfinder.integrations.remote.cli:main"
ppigfinder-slurm = "ppigfinder.hpc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ppigfinder", "ppigfinder.*"]

[tool.setuptools.package-data]
ppigfinder = ["terminal_banner.txt", "terminal_manual.txt"]
