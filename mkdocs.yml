site_name: ppigFinder
site_description: Genomic analysis and protein–protein interaction candidate discovery
site_url: https://leepusp.github.io/ppigFinder-v1/
repo_url: https://github.com/leepusp/ppigFinder-v1
repo_name: leepusp/ppigFinder-v1
edit_uri: edit/main/docs/
docs_dir: docs

copyright: ppigFinder — open-source research software, MIT license

theme:
  name: material
  language: en
  logo: assets/figures/favicon.svg
  favicon: assets/figures/favicon.svg
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start:
      - Installation: user_manual/installation.md
      - Quick Start: user_manual/quick_start_v29_14.md
      - Xanthomonas Tutorial: tutorials/xanthomonas.md
      - Interface Tour: user_manual/interface_tour.md
  - User Manual:
      - Complete Guide: user_manual/complete_guide.md
      - Genome: user_manual/genome.md
      - ORF Prediction: user_manual/orf_prediction.md
      - ORF Browser: user_manual/orfs.md
      - Annotation: user_manual/annotation.md
      - Protein Interactions / AlphaFold: user_manual/alphafold.md
      - AlphaFold 3 local installation: user_manual/af3_local_installation.md
      - Results and Reports: user_manual/reports.md
      - Troubleshooting: user_manual/troubleshooting.md
  - Execution:
      - Where to run predictions: user_manual/hpc_submission.md
      - DaVinci example: user_manual/davinci_hpc.md
      - Optional remote connections: user_manual/remote_connections.md
      - OpenSSH native transport: user_manual/openssh_native_transport.md
  - Development:
      - Feature status: developer/feature_status.md
      - Capabilities and integrations: developer/capabilities.md
      - Architecture: developer/software_architecture.md
      - HPC portability: developer/hpc_portability.md
      - SSH/SFTP transport contract: developer/remote_transport.md
      - Directory map: developer/directory_layout.md
      - Prediction internals: developer/structure_prediction/README.md
  - Publication: publication.md
