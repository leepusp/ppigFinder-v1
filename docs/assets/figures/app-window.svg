<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Inter, Roboto, Arial, sans-serif">
  <title>ppigfinder main window layout</title>
  <rect width="1200" height="720" rx="16" fill="#eceff1"/>
  <!-- window frame -->
  <rect x="20" y="20" width="1160" height="680" rx="10" fill="#fff" stroke="#b0bec5" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="32" rx="10" fill="#cfd8dc"/>
  <circle cx="44" cy="36" r="6" fill="#ef5350"/><circle cx="64" cy="36" r="6" fill="#ffca28"/><circle cx="84" cy="36" r="6" fill="#66bb6a"/>
  <text x="600" y="41" text-anchor="middle" font-size="13" fill="#37474f">ppigfinder</text>

  <!-- toolbar -->
  <rect x="30" y="62" width="1140" height="46" rx="6" fill="#e8eaf6"/>
  <g font-size="12" fill="#1a237e" font-weight="600">
    <rect x="40" y="70" width="104" height="30" rx="5" fill="#fff" stroke="#9fa8da"/><text x="92" y="90" text-anchor="middle">Load genome</text>
    <rect x="152" y="70" width="104" height="30" rx="5" fill="#fff" stroke="#9fa8da"/><text x="204" y="90" text-anchor="middle">Predict ORFs</text>
    <rect x="264" y="70" width="104" height="30" rx="5" fill="#fff" stroke="#9fa8da"/><text x="316" y="90" text-anchor="middle">HMM scan</text>
    <rect x="376" y="70" width="104" height="30" rx="5" fill="#fff" stroke="#9fa8da"/><text x="428" y="90" text-anchor="middle">Pfam-A scan</text>
    <rect x="488" y="70" width="104" height="30" rx="5" fill="#fff" stroke="#9fa8da"/><text x="540" y="90" text-anchor="middle">Export map</text>
    <rect x="600" y="70" width="70" height="30" rx="5" fill="#fff" stroke="#9fa8da"/><text x="635" y="90" text-anchor="middle">Zoom +/−</text>
  </g>
  <circle cx="1130" cy="85" r="5" fill="#ef6c00"/><text x="1118" y="89" text-anchor="end" font-size="11" fill="#546e7a">toolbar</text>

  <!-- genome map -->
  <rect x="30" y="118" width="720" height="210" rx="6" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="42" y="138" font-size="13" font-weight="700" fill="#37474f">① Interactive genome map</text>
  <line x1="50" y1="230" x2="730" y2="230" stroke="#90a4ae" stroke-width="2"/>
  <g>
    <polygon points="70,215 120,215 130,230 120,245 70,245" fill="#9fa8da"/>
    <polygon points="140,215 200,215 210,230 200,245 140,245" fill="#9fa8da"/>
    <polygon points="225,215 300,215 310,230 300,245 225,245" fill="#ffb300"/>
    <polygon points="330,215 400,215 410,230 400,245 330,245" fill="#ef6c00"/>
    <polygon points="430,215 480,215 490,230 480,245 430,245" fill="#9fa8da"/>
    <polygon points="520,215 600,215 610,230 600,245 520,245" fill="#9fa8da"/>
    <polygon points="500,170 430,170 420,185 430,200 500,200" fill="#ffb300" transform="translate(120,0)"/>
    <polygon points="650,215 710,215 720,230 710,245 650,245" fill="#9fa8da"/>
  </g>
  <text x="365" y="272" text-anchor="middle" font-size="12" fill="#546e7a">arrows = ORFs · colour = HMM hit · click to select</text>
  <g font-size="11" fill="#37474f">
    <rect x="50" y="296" width="12" height="12" fill="#ffb300"/><text x="68" y="306">T4SS / XVIPCD hit</text>
    <rect x="190" y="296" width="12" height="12" fill="#ef6c00"/><text x="208" y="306">selected ORF</text>
    <rect x="310" y="296" width="12" height="12" fill="#9fa8da"/><text x="328" y="306">no hit</text>
  </g>

  <!-- ORF table -->
  <rect x="30" y="338" width="720" height="352" rx="6" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="42" y="358" font-size="13" font-weight="700" fill="#37474f">② ORF annotation table</text>
  <rect x="42" y="368" width="696" height="26" fill="#c5cae9"/>
  <g font-size="11" font-weight="700" fill="#1a237e">
    <text x="52" y="385">ORF</text><text x="122" y="385">Strand</text><text x="190" y="385">Start–End</text><text x="300" y="385">Len</text><text x="360" y="385">GC%</text><text x="420" y="385">HMM annotation</text><text x="620" y="385">Score</text>
  </g>
  <g font-size="11" fill="#455a64">
    <rect x="42" y="394" width="696" height="26" fill="#fff"/><text x="52" y="411">ORF0763</text><text x="122" y="411">+</text><text x="190" y="411">… – …</text><text x="300" y="411">…</text><text x="360" y="411">…</text><text x="420" y="411">XVIPCD (PF20410)</text><text x="620" y="411">…</text>
    <rect x="42" y="420" width="696" height="26" fill="#fff3e0"/><text x="52" y="437">ORF2601</text><text x="122" y="437">−</text><text x="190" y="437">… – …</text><text x="300" y="437">…</text><text x="360" y="437">…</text><text x="420" y="437">VirD4 (T4SS coupling protein)</text><text x="620" y="437">…</text>
    <rect x="42" y="446" width="696" height="26" fill="#fff"/><text x="52" y="463">ORF2588</text><text x="122" y="463">+</text><text x="190" y="463">… – …</text><text x="300" y="463">…</text><text x="360" y="463">…</text><text x="420" y="463">XVIPCD (PF20410)</text><text x="620" y="463">…</text>
    <rect x="42" y="472" width="696" height="26" fill="#fff"/><text x="52" y="489">…</text>
  </g>
  <text x="390" y="560" text-anchor="middle" font-size="12" fill="#78909c">sortable · filterable · manual annotation editing</text>

  <!-- right panel -->
  <rect x="760" y="118" width="410" height="572" rx="6" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="772" y="138" font-size="13" font-weight="700" fill="#37474f">③ Mode tabs</text>
  <g font-size="11" font-weight="600">
    <rect x="772" y="148" width="74" height="26" rx="4" fill="#3f51b5"/><text x="809" y="165" text-anchor="middle" fill="#fff">Domains</text>
    <rect x="850" y="148" width="92" height="26" rx="4" fill="#e8eaf6"/><text x="896" y="165" text-anchor="middle" fill="#1a237e">Neighborhood</text>
    <rect x="946" y="148" width="74" height="26" rx="4" fill="#e8eaf6"/><text x="983" y="165" text-anchor="middle" fill="#1a237e">AlphaFold</text>
    <rect x="1024" y="148" width="84" height="26" rx="4" fill="#e8eaf6"/><text x="1066" y="165" text-anchor="middle" fill="#1a237e">Submit AF3</text>
    <rect x="772" y="180" width="118" height="26" rx="4" fill="#e8eaf6"/><text x="831" y="197" text-anchor="middle" fill="#1a237e">AF3 Table Results</text>
    <rect x="894" y="180" width="70" height="26" rx="4" fill="#e8eaf6"/><text x="929" y="197" text-anchor="middle" fill="#1a237e">PPI Map</text>
    <rect x="968" y="180" width="92" height="26" rx="4" fill="#e8eaf6"/><text x="1014" y="197" text-anchor="middle" fill="#1a237e">PPI Analysis</text>
  </g>
  <rect x="772" y="218" width="386" height="460" rx="6" fill="#fff" stroke="#e0e0e0"/>
  <text x="965" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">Domain view of the selected ORF</text>
  <rect x="800" y="280" width="330" height="22" rx="4" fill="#cfd8dc"/>
  <rect x="830" y="280" width="80" height="22" rx="4" fill="#ffb300"/>
  <rect x="940" y="280" width="120" height="22" rx="4" fill="#9fa8da"/>
  <text x="965" y="330" text-anchor="middle" font-size="11" fill="#78909c">protein length with HMM domain hits</text>
  <rect x="800" y="360" width="330" height="150" rx="6" fill="#f5f6fc" stroke="#e0e0e0"/>
  <text x="965" y="440" text-anchor="middle" font-size="12" fill="#90a4ae">tab content changes with the selected mode</text>
  <text x="965" y="470" text-anchor="middle" font-size="11" fill="#b0bec5">(neighborhood · PAE map · pLDDT · ranking table · PPI map)</text>
</svg>
