name: Python syntax and packaging smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'ppigfinder/**'
      - 'tests/**'
      - 'scripts/developer/**'
      - 'main.py'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging dependencies
        run: python -m pip install -e . PyQt6
      - name: Syntax check
        run: python -m compileall -q ppigfinder main.py
      - name: Test optional execution modes
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: AF3 native format and execution adapter tests
        run: python -m unittest discover -s tests -p 'test_af3_*.py' -v
      - name: Import headless scientific modules
        shell: bash
        run: |
          python - <<'PY'
          from ppigfinder.alphafold.af3_cli import AF3CliOptions
          from ppigfinder.structure_prediction.af3_input_writer import render_af3_input_json
          print('Headless imports OK')
          PY
