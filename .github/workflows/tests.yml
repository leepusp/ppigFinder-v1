name: Python syntax and packaging smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'ppigfinder/**'
      - 'tests/**'
      - 'scripts/developer/**'
      - 'scripts/install_ppigfinder.py'
      - 'main.py'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux Qt libraries and HMMER
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 hmmer
      - name: Install with the local setup assistant
        run: python scripts/install_ppigfinder.py --terminal --desktop-only
      - name: Use the installed environment
        run: python -c "import os; from pathlib import Path; f = open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8'); print(Path('.venv', 'Scripts' if os.name == 'nt' else 'bin').resolve(), file=f); f.close()"
      - name: Syntax check
        run: python -m compileall -q ppigfinder main.py
      - name: Run regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scientific and Slurm script self-checks
        if: runner.os == 'Linux'
        run: |
          python scripts/developer/check_alphafold_service_general.py
          python scripts/developer/check_structure_prediction_backend.py
          python scripts/developer/check_structure_prediction_service.py
          python scripts/developer/check_structure_prediction_slurm_af3.py
          python scripts/developer/check_af3_hotspot_v29_14.py
          python scripts/developer/check_af3_parsed_result_v29_14.py
          python scripts/developer/check_af3_results_export_v29_14.py
      - name: Run real HMMER annotation smoke test
        if: runner.os == 'Linux'
        run: python scripts/developer/check_hmmer_annotation.py
      - name: Import headless scientific modules
        shell: bash
        run: |
          python - <<'PY'
          from ppigfinder.alphafold.af3_cli import AF3CliOptions
          from ppigfinder.structure_prediction.af3_input_writer import render_af3_input_json
          print('Headless imports OK')
          PY
